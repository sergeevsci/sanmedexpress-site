server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me}
  email:
    enabled: ${EMAIL_ENABLED:false}
    to: ${EMAIL_TO:}
    from: ${EMAIL_FROM:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    ru.sanmedexpress: ${LOG_LEVEL_APP:INFO}
    org.springframework.mail: ${LOG_LEVEL_MAIL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,Europe/Moscow} %-5level [%thread] %logger{36} - %msg%n"
