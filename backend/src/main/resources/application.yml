server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sanmedexpress}
    username: ${SPRING_DATASOURCE_USERNAME:sanmedexpress}
    password: ${SPRING_DATASOURCE_PASSWORD:sanmedexpress}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me}
  email:
    enabled: ${EMAIL_ENABLED:false}
    to: ${EMAIL_TO:sergeevsci@yandex.ru}
    from: ${EMAIL_FROM:no-reply@sanmedexpress.local}
