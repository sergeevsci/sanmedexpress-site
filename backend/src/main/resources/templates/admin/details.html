<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Заявка #' + ${order.id}">Заявка</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main class="page narrow">
  <a href="/admin" class="link back-link">← Все заявки</a>
  <section class="card details">
    <div class="details-head">
      <div>
        <h1 th:text="'Заявка #' + ${order.id}">Заявка</h1>
        <p th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></p>
      </div>
      <button type="button" class="copy-btn primary-copy" th:attr="data-copy='Заявка #' + ${order.id} + '\nИмя: ' + ${order.client.name} + '\nТелефон: ' + ${order.client.phone} + '\nКомментарий: ' + (${order.comment} ?: '-')">Копировать заявку</button>
    </div>
    <dl>
      <dt>Дата</dt><dd th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></dd>
      <dt>Имя</dt><dd th:text="${order.client.name}"></dd>
      <dt>Телефон</dt><dd><a th:href="'tel:' + ${order.client.phone}" th:text="${order.client.phone}"></a> <button type="button" class="copy-btn" th:attr="data-copy=${order.client.phone}">Копировать</button></dd>
      <dt>Комментарий</dt><dd th:text="${order.comment ?: '-'}"></dd>
      <dt>Источник</dt><dd th:text="${order.source}"></dd>
      <dt>IP</dt><dd th:text="${order.ipAddress ?: '-'}"></dd>
      <dt>User-Agent</dt><dd th:text="${order.userAgent ?: '-'}"></dd>
    </dl>
    <form method="post" th:action="@{/admin/{id}/status(id=${order.id})}" class="status-form">
      <label>Статус</label>
      <select name="status">
        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status.title}" th:selected="${status == order.status}"></option>
      </select>
      <button type="submit">Сохранить</button>
    </form>
  </section>
</main>
<script src="/admin/admin.js"></script>
</body>
</html>
